<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TS → MP4 Turbo Converter</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="container">
    <section class="card">
      <div class="topline"><div class="badge">FFmpeg TURBO</div><div class="target">75× target</div></div>
      <h1>TS → MP4</h1>
      <p class="subtitle">Upload multiple files. One converts at a time while the rest wait in the queue.</p>

      <label class="dropzone" id="dropzone">
        <input id="fileInput" type="file" accept=".ts,video/mp2t" multiple hidden>
        <span class="icon">↑</span>
        <strong>Drop your .TS files here</strong>
        <span>or click to select multiple files</span>
      </label>

      <div class="actions">
        <button id="uploadBtn" type="button" disabled>Upload selected files</button>
        <button id="clearBtn" type="button" class="secondary" disabled>Clear completed</button>
      </div>

      <section class="summary">
        <span><strong id="totalCount">0</strong> files</span>
        <span><strong id="activeCount">0</strong> active</span>
        <span><strong id="queueCount">0</strong> queued</span>
        <span><strong id="doneCount">0</strong> complete</span>
      </section>

      <section id="queue" class="queue"></section>
      <p id="error" class="error hidden"></p>
    </section>
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
